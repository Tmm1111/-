<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高铁背规抽题神器</title>
<style>
:root{
  --bg:#eef4ff;
  --card:#ffffff;
  --text:#0f172a;
  --sub:#64748b;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --answer:#f1f5ff;
  --danger:#ef4444;
  --green:#10b981;
  --gray:#64748b;
  --shadow:0 14px 36px rgba(15,23,42,.10);
  --border:rgba(37,99,235,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220;
    --card:#111827;
    --text:#f8fafc;
    --sub:#94a3b8;
    --primary:#60a5fa;
    --primary2:#3b82f6;
    --answer:#172033;
    --danger:#f87171;
    --green:#34d399;
    --gray:#94a3b8;
    --shadow:0 14px 36px rgba(0,0,0,.45);
    --border:rgba(96,165,250,.20);
  }
}
*{box-sizing:border-box;}
body{
  margin:0;
  padding:14px;
  background:
    radial-gradient(circle at top left, rgba(37,99,235,.16), transparent 34%),
    var(--bg);
  color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
.container{max-width:940px;margin:0 auto;}
.main-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:18px;
  box-shadow:var(--shadow);
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.title{
  font-size:26px;
  font-weight:900;
  letter-spacing:.2px;
}
.badge{
  color:var(--sub);
  font-size:14px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(100,116,139,.10);
}
.question-card{
  min-height:270px;
  border-radius:24px;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg, rgba(37,99,235,.15), rgba(99,102,241,.06));
  border:1px solid var(--border);
}
.question-card.rolling{
  animation:pulse .12s ease-in-out infinite alternate;
}
@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.006);}
}
.question{
  font-size:36px;
  font-weight:900;
  line-height:1.65;
  white-space:pre-wrap;
}
.answer{
  display:none;
  margin-top:16px;
  padding:18px;
  border-radius:20px;
  background:var(--answer);
  border:1px solid var(--border);
  font-size:21px;
  line-height:1.85;
  white-space:pre-wrap;
}
.status{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  border-radius:16px;
  padding:12px;
  background:rgba(100,116,139,.10);
  color:var(--sub);
  font-weight:700;
  text-align:center;
}
.timer{
  color:var(--danger);
  font-size:22px;
  font-weight:900;
}
.controls{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
button{
  border:none;
  border-radius:16px;
  padding:15px 12px;
  font-size:17px;
  font-weight:850;
  color:white;
  background:var(--primary);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.985);}
button.secondary{background:var(--gray);}
button.green{background:var(--green);}
button.red{background:var(--danger);}
button.active{outline:3px solid rgba(37,99,235,.25); background:var(--primary2);}
.footer{
  margin-top:18px;
  padding:18px;
  border-radius:20px;
  background:var(--card);
  box-shadow:var(--shadow);
  color:var(--sub);
  line-height:1.85;
  font-size:15px;
}
.footer details summary{
  cursor:pointer;
  font-weight:800;
  color:var(--text);
}
@media(max-width:720px){
  .question{font-size:28px;}
  .question-card{min-height:245px; padding:18px;}
  .status{grid-template-columns:1fr;}
  .controls{grid-template-columns:1fr;}
  .title{font-size:22px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="main-card">
    <div class="topbar">
      <div class="title">高铁背规抽题神器</div>
      <div class="badge" id="modeText">当前模式：全部随机</div>
    </div>

    <div class="question-card" id="qCard">
      <div class="question" id="question">点击“开始抽题”</div>
    </div>

    <div class="answer" id="answer"></div>

    <div class="status">
      <div class="stat" id="qInfo">题号：-</div>
      <div class="stat">倒计时：<span class="timer" id="timer">-</span></div>
      <div class="stat" id="wrongCount">易错题：0题</div>
    </div>

    <div class="controls">
      <button id="startBtn" onclick="toggleRolling()">开始抽题</button>
      <button onclick="toggleAnswer()">显示/隐藏答案</button>
      <button class="secondary" id="btnAll" onclick="setMode('all')">全部随机（104题）</button>
      <button class="secondary" id="btnShort" onclick="setMode('short')">150字以下（48题）</button>
      <button class="secondary" id="btnLong" onclick="setMode('long')">150字以上（56题）</button>
      <button class="green" id="wrongBtn" onclick="toggleWrong()">加入易错题</button>
      <button class="secondary" onclick="setMode('wrong')">只抽易错题</button>
      <button class="red" onclick="clearWrong()">清空易错题</button>
    </div>
  </div>

  <div class="footer">
    <details>
      <summary>说明</summary>
      <div style="margin-top:10px;">
        • 150字以下答题时间为120秒，150字以上答题时间为180秒。<br>
        • 抽下一题会自动隐藏上一题答案，并重置倒计时。<br>
        • 易错题保存在本机浏览器里，下次打开仍可使用。<br>
        • 清空易错题会同时删除新版和旧版保存记录。<br>
        • 页面支持随系统自动切换深色/浅色模式。
      </div>
    </details>
  </div>
</div>

<script>
const db = [

let currentMode = "all";
let currentItem = null;
let rollingTimer = null;
let countdownTimer = null;
let leftSeconds = 0;

const drawState = {
  all: {bag: [], recent: []},
  short: {bag: [], recent: []},
  long: {bag: [], recent: []},
  wrong: {bag: [], recent: []}
};

let wrongList = loadWrongList();

function loadWrongList(){
  try {
    const newer = JSON.parse(localStorage.getItem("wrongQuestions_final_v1") || "[]");
    if (Array.isArray(newer) && newer.length) return newer;
    const old = JSON.parse(localStorage.getItem("wrongQuestions_v1") || "[]");
    if (Array.isArray(old) && old.length) {
      return old.map(x => typeof x === "string" ? x : x.q).filter(Boolean);
    }
  } catch(e) {}
  return [];
}

function saveWrongList(){
  localStorage.setItem("wrongQuestions_final_v1", JSON.stringify(wrongList));
}

function getPool(mode=currentMode){
  if(mode === "short") return db.filter(x => x.type === "short");
  if(mode === "long") return db.filter(x => x.type === "long");
  if(mode === "wrong") return db.filter(x => wrongList.includes(x.q));
  return [...db];
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function refill(mode=currentMode){
  const pool=getPool(mode);
  const recentSet=new Set(drawState[mode].recent.map(x=>x.q));
  const s=shuffle(pool);
  const fresh=s.filter(x=>!recentSet.has(x.q));
  const recent=s.filter(x=>recentSet.has(x.q));
  drawState[mode].bag=[...fresh,...recent];
}

function drawQuestion(){
  const pool=getPool(currentMode);
  if(pool.length === 0) return null;
  if(drawState[currentMode].bag.length === 0) refill(currentMode);

  let item = drawState[currentMode].bag.shift();

  let guard=0;
  while(item && currentItem && item.q === currentItem.q && drawState[currentMode].bag.length > 0 && guard < 10){
    drawState[currentMode].bag.push(item);
    item = drawState[currentMode].bag.shift();
    guard++;
  }

  drawState[currentMode].recent.push(item);
  const limit=Math.min(12, Math.max(3, Math.floor(pool.length/4)));
  if(drawState[currentMode].recent.length > limit){
    drawState[currentMode].recent = drawState[currentMode].recent.slice(-limit);
  }
  return item;
}

function toggleRolling(){
  const pool=getPool(currentMode);
  if(pool.length === 0){
    alert(currentMode === "wrong" ? "还没有易错题，先加入几题再来抽。" : "当前题库为空。");
    return;
  }

  if(rollingTimer){
    stopRollingAndPick();
    return;
  }

  hideAnswer();
  stopCountdown();
  document.getElementById("startBtn").innerText="停止";
  document.getElementById("qCard").classList.add("rolling");

  rollingTimer=setInterval(()=>{
    const p=getPool(currentMode);
    const rand=p[Math.floor(Math.random()*p.length)];
    document.getElementById("question").innerText=rand.q;
  },45);
}

function stopRollingAndPick(){
  clearInterval(rollingTimer);
  rollingTimer=null;
  document.getElementById("qCard").classList.remove("rolling");
  document.getElementById("startBtn").innerText="继续抽题";

  hideAnswer();
  currentItem=drawQuestion();
  if(!currentItem) return;

  document.getElementById("question").innerText=currentItem.q;
  document.getElementById("answer").innerText=currentItem.a;
  document.getElementById("qInfo").innerText="题号："+extractNo(currentItem.q);
  updateWrongUI();
  startCountdown(currentItem.type === "short" ? 120 : 180);
}

function extractNo(q){
  const m = String(q).match(/^\s*(\d+)/);
  return m ? m[1] : "-";
}

function startCountdown(seconds){
  stopCountdown();
  leftSeconds=seconds;
  renderTimer();

  countdownTimer=setInterval(()=>{
    leftSeconds--;
    renderTimer();
    if(leftSeconds <= 0){
      stopCountdown(false);
      document.getElementById("timer").innerText="时间到";
    }
  },1000);
}

function stopCountdown(clear=true){
  if(countdownTimer){
    clearInterval(countdownTimer);
    countdownTimer=null;
  }
  if(clear){
    document.getElementById("timer").innerText="-";
  }
}

function renderTimer(){
  document.getElementById("timer").innerText=leftSeconds + "秒";
}

function hideAnswer(){
  document.getElementById("answer").style.display="none";
}

function toggleAnswer(){
  if(!currentItem){
    alert("请先抽一道题");
    return;
  }
  const el=document.getElementById("answer");
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function setMode(mode){
  if(rollingTimer){
    clearInterval(rollingTimer);
    rollingTimer=null;
    document.getElementById("qCard").classList.remove("rolling");
    document.getElementById("startBtn").innerText="开始抽题";
  }
  stopCountdown();
  hideAnswer();
  currentMode=mode;
  drawState[mode].bag=[];
  refill(mode);

  const name = mode === "short" ? "150字以下" : mode === "long" ? "150字以上" : mode === "wrong" ? "易错题" : "全部随机";
  const total = getPool(mode).length;
  document.getElementById("modeText").innerText=`当前模式：${name}（${total}题）`;
  document.getElementById("question").innerText=`当前模式：${name}，共 ${total} 题。点击“开始抽题”`;
  document.getElementById("qInfo").innerText="题号：-";
  currentItem=null;
  updateModeButtons();
  updateWrongUI();
}

function updateModeButtons(){
  ["btnAll","btnShort","btnLong"].forEach(id=>document.getElementById(id).classList.remove("active"));
  if(currentMode==="all") document.getElementById("btnAll").classList.add("active");
  if(currentMode==="short") document.getElementById("btnShort").classList.add("active");
  if(currentMode==="long") document.getElementById("btnLong").classList.add("active");
}

function isWrong(item){
  return item && wrongList.includes(item.q);
}

function toggleWrong(){
  if(!currentItem){
    alert("请先抽一道题");
    return;
  }
  if(isWrong(currentItem)){
    wrongList = wrongList.filter(q => q !== currentItem.q);
  }else{
    wrongList.push(currentItem.q);
  }
  saveWrongList();
  drawState.wrong.bag=[];
  updateWrongUI();

  if(currentMode === "wrong" && !isWrong(currentItem)){
    document.getElementById("question").innerText="该题已移出易错题，继续抽下一题即可。";
    hideAnswer();
    stopCountdown();
    currentItem=null;
  }
}

function clearWrong(){
  wrongList=[];
  localStorage.removeItem("wrongQuestions_final_v1");
  localStorage.removeItem("wrongQuestions_v1");
  localStorage.removeItem("wrongQuestions");
  localStorage.removeItem("wrongList");
  saveWrongList();

  drawState.wrong={bag:[], recent:[]};
  updateWrongUI();

  if(currentMode === "wrong"){
    setMode("all");
  }else{
    alert("易错题已清空");
  }
}

function updateWrongUI(){
  document.getElementById("wrongCount").innerText="易错题："+wrongList.length+"题";
  document.getElementById("wrongBtn").innerText=isWrong(currentItem) ? "移出易错题" : "加入易错题";
}

updateModeButtons();
updateWrongUI();
</script>
</body>
</html>
